<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .word { font-family: 'Century Gothic', 'Futura', Avenir, 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Icon frame: representasi "ruang" (etalase/jendela toko) -->
  <rect x="48" y="40" width="160" height="160" rx="28" fill="none" stroke="#E2789A" stroke-width="5"/>

  <!-- Aksen "gaya": goresan diagonal tipis -->
  <line x1="94" y1="122" x2="152" y2="106" stroke="#C24F73" stroke-width="4" stroke-linecap="round"/>

  <!-- Siluet sepatu (loafer), digambar sebagai garis tunggal yang elegan -->
  <path d="M78,178
           C76,167 78,157 88,152
           C98,147 108,149 114,154
           C124,147 140,139 158,139
           C174,139 186,145 190,154
           C194,161 192,167 186,170
           L178,172
           C158,175 118,176 96,177
           Z"
        fill="#3A1B2E"/>

  <!-- Wordmark -->
  <text x="248" y="112" class="word" font-size="54" font-weight="600" fill="#3A1B2E" letter-spacing="1">Ruang</text>
  <text x="248" y="167" class="word" font-size="54" font-weight="600" fill="#3A1B2E" letter-spacing="1">Gaya</text>

  <!-- Garis pemisah -->
  <line x1="250" y1="180" x2="410" y2="180" stroke="#E2789A" stroke-width="1.5" opacity="0.7"/>

  <!-- Tagline -->
  <text x="250" y="200" class="word" font-size="15" fill="#C24F73" letter-spacing="3">sepatu &amp; pakaian</text>
</svg>
